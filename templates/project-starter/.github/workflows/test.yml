name: Tests
on:
  pull_request:
  push:
  # volunteer-apply.yml starts this by hand, because a pull request opened
  # with GITHUB_TOKEN does not trigger pull_request workflows.
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
